<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plan de medios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F5F3;
    --surface:#FFFFFF;
    --ink:#1B1C1E;
    --ink-soft:#6D6E72;
    --ink-faint:#A9AAAD;
    --border:#E3E3DF;
    --border-soft:#EDEDEA;
    --accent:#1E3A5F;
    --accent-soft:#EAF0F6;
    --danger:#B23A3A;
    --radius-s:6px;
    --radius-m:10px;
    --radius-l:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    font-size:14px;
    line-height:1.45;
  }
  #app{display:flex; min-height:100vh;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:252px;
    flex-shrink:0;
    background:var(--surface);
    border-right:1px solid var(--border);
    padding:22px 16px;
    display:flex;
    flex-direction:column;
    gap:22px;
  }
  .brand-title{
    font-weight:700;
    font-size:16px;
    letter-spacing:-0.01em;
    padding:0 6px;
  }
  .brand-title span{color:var(--ink-soft); font-weight:500; font-size:12px; display:block; margin-top:2px;}
  .brand-list{display:flex; flex-direction:column; gap:2px;}
  .brand-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 10px;
    border-radius:var(--radius-s);
    cursor:pointer;
    border:1px solid transparent;
    background:none;
    font-family:inherit;
    font-size:13px;
    color:var(--ink);
    text-align:left;
    width:100%;
  }
  .brand-item:hover{background:var(--border-soft);}
  .brand-item.active{background:var(--accent-soft); border-color:#D7E2EC;}
  .brand-dot{width:9px; height:9px; border-radius:50%; flex-shrink:0;}
  .brand-name{flex:1; font-weight:500;}
  .brand-count{font-size:11px; color:var(--ink-faint); font-variant-numeric:tabular-nums;}
  .brand-item.active .brand-count{color:var(--ink-soft);}

  .all-toggle{
    margin-top:4px;
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 10px;
    border-radius:var(--radius-s);
    cursor:pointer;
    border:1px solid var(--border);
    background:var(--surface);
    font-family:inherit;
    font-size:13px;
    font-weight:500;
    color:var(--ink);
    width:100%;
  }
  .all-toggle.active{background:var(--ink); border-color:var(--ink); color:#fff;}
  .all-toggle .swatches{display:flex; gap:2px;}
  .all-toggle .swatches i{width:6px; height:9px; border-radius:1px; display:block;}

  .sidebar-footer{margin-top:auto; font-size:11.5px; color:var(--ink-faint); padding:0 6px; line-height:1.5;}

  /* ---------- Main ---------- */
  .main{flex:1; padding:22px 28px 40px; min-width:0;}
  .toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:14px;
    margin-bottom:18px;
  }
  .month-nav{display:flex; align-items:center; gap:10px;}
  .nav-btn{
    width:30px; height:30px;
    border-radius:50%;
    border:1px solid var(--border);
    background:var(--surface);
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    color:var(--ink);
  }
  .nav-btn:hover{background:var(--border-soft);}
  .month-label{font-size:19px; font-weight:700; letter-spacing:-0.01em; min-width:200px;}
  .month-label .yr{color:var(--ink-soft); font-weight:500;}
  select.year-select{
    font-family:inherit; font-size:13px; font-weight:500; color:var(--ink-soft);
    border:1px solid var(--border); border-radius:var(--radius-s); padding:5px 8px; background:var(--surface); cursor:pointer;
  }
  .today-btn{
    font-family:inherit; font-size:12.5px; font-weight:500; color:var(--ink-soft);
    border:1px solid var(--border); border-radius:var(--radius-s); padding:6px 10px; background:var(--surface); cursor:pointer;
  }
  .today-btn:hover{background:var(--border-soft);}

  .toolbar-actions{display:flex; gap:8px;}
  .btn{
    font-family:inherit; font-size:13px; font-weight:600; border-radius:var(--radius-s);
    padding:8px 14px; cursor:pointer; border:1px solid transparent; display:flex; align-items:center; gap:6px;
  }
  .btn-primary{background:var(--accent); color:#fff;}
  .btn-primary:hover{background:#16304f;}
  .btn-ghost{background:var(--surface); border-color:var(--border); color:var(--ink);}
  .btn-ghost:hover{background:var(--border-soft);}
  .btn:disabled{opacity:.45; cursor:not-allowed;}
  .btn:disabled:hover{background:var(--surface);}

  .context-line{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
  .context-count{font-size:12.5px; color:var(--ink-soft);}
  .context-count b{color:var(--ink); font-weight:600;}

  /* ---------- PDF area / calendar ---------- */
  #pdfArea{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-l); padding:22px 22px 10px; overflow:hidden;}
  .pdf-header{display:flex; align-items:center; gap:10px; margin-bottom:16px;}
  .pdf-header .bar{width:5px; height:24px; border-radius:3px;}
  .pdf-header h2{font-size:16px; font-weight:700; margin:0;}
  .pdf-header .sub{font-size:12.5px; color:var(--ink-soft); font-weight:500;}

  .weekday-row{display:grid; grid-template-columns:repeat(7,1fr); border-bottom:1px solid var(--border); margin-bottom:2px;}
  .weekday-row div{
    font-size:11px; font-weight:600; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.04em;
    padding:0 8px 8px;
  }

  .week-row{position:relative; display:grid; grid-template-columns:repeat(7,1fr);}
  .cell-bg{
    grid-row:1/-1; border-right:1px solid var(--border-soft); border-bottom:1px solid var(--border-soft);
  }
  .cell-bg:nth-child(7n){border-right:none;}
  .day-num{grid-row:1; padding:9px 8px 6px; font-size:12px; font-weight:600; color:var(--ink);}
  .day-num.dim{color:var(--ink-faint); font-weight:500;}
  .day-num.today .num-badge{
    background:var(--accent); color:#fff; border-radius:50%; width:19px; height:19px; display:inline-flex; align-items:center; justify-content:center; font-size:11px;
  }
  .day-cell-click{grid-row:1; cursor:pointer;}

  .event-bar{
    align-self:center; margin:0 2px; height:19px; display:flex; align-items:center; padding:0 7px;
    font-size:10.5px; font-weight:600; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    cursor:pointer; letter-spacing:.005em;
    -webkit-print-color-adjust:exact;
    print-color-adjust:exact;
  }
  .event-bar.round-l{border-top-left-radius:5px; border-bottom-left-radius:5px;}
  .event-bar.round-r{border-top-right-radius:5px; border-bottom-right-radius:5px;}
  .event-bar .bname{opacity:.8; font-weight:500;}

  .empty-state{padding:50px 10px; text-align:center; color:var(--ink-soft);}
  .empty-state .big{font-size:14px; font-weight:600; color:var(--ink); margin-bottom:4px;}
  .empty-state .small{font-size:12.5px;}

  /* ---------- Feedback ---------- */
  .feedback-panel{
    margin-top:18px; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-l); padding:20px 22px 16px;
  }
  .feedback-head{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px;}
  .feedback-head h3{margin:0; font-size:15px; font-weight:700;}
  .feedback-head .sub{font-size:12.5px; color:var(--ink-soft); font-weight:500; margin-top:2px;}
  .feedback-list{display:flex; flex-direction:column; gap:8px;}
  .feedback-card{
    border:1px solid var(--border); border-radius:var(--radius-m); padding:12px 14px;
    cursor:pointer; background:var(--surface); text-align:left; width:100%;
    font-family:inherit; color:inherit;
  }
  .feedback-card:hover{background:var(--border-soft);}
  .feedback-card-meta{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:6px;}
  .feedback-author{font-size:13px; font-weight:600;}
  .feedback-date{font-size:11.5px; color:var(--ink-faint);}
  .feedback-brand-tag, .feedback-campaign-tag{
    font-size:11px; font-weight:600; color:var(--ink-soft);
    display:inline-flex; align-items:center; gap:6px;
    background:var(--border-soft); border-radius:99px; padding:2px 8px;
  }
  .feedback-campaign{
    font-size:12.5px; font-weight:600; color:var(--ink); margin-bottom:6px;
    display:flex; align-items:center; gap:7px;
  }
  .feedback-campaign span{color:var(--ink-soft); font-weight:500;}
  .feedback-text{
    font-size:13px; color:var(--ink); white-space:pre-wrap; line-height:1.5;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
  }
  .feedback-empty{padding:22px 4px 10px; color:var(--ink-soft); font-size:13px;}

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(20,20,22,.42); display:none; align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .overlay.open{display:flex;}
  .modal{
    background:var(--surface); border-radius:var(--radius-l); width:100%; max-width:420px; padding:24px; box-shadow:0 20px 60px rgba(0,0,0,.18);
  }
  .modal h3{margin:0 0 4px; font-size:16.5px; font-weight:700;}
  .modal .modal-sub{font-size:12.5px; color:var(--ink-soft); margin-bottom:18px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:6px;}
  .field input[type=text], .field textarea, .field select, .field input[type=date]{
    width:100%; font-family:inherit; font-size:13.5px; padding:9px 10px; border:1px solid var(--border); border-radius:var(--radius-s);
    color:var(--ink); background:var(--surface);
  }
  .field input:focus, .field textarea:focus, .field select:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent);}
  .field textarea{resize:vertical; min-height:60px;}
  .field-row{display:flex; gap:10px;}
  .field-row .field{flex:1;}
  .brand-fixed{
    display:flex; align-items:center; gap:8px; padding:9px 10px; border:1px solid var(--border); border-radius:var(--radius-s); background:var(--border-soft); font-size:13.5px; font-weight:500;
  }
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:20px;}
  .field-error{font-size:12px; color:var(--danger); margin-top:6px; display:none;}
  .field-error.show{display:block;}

  .detail-swatch{width:100%; height:5px; border-radius:3px; margin-bottom:14px;}
  .detail-row{margin-bottom:12px;}
  .detail-row .lbl{font-size:11px; font-weight:600; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.04em; margin-bottom:3px;}
  .detail-row .val{font-size:14px; color:var(--ink);}
  .detail-row .val.desc{white-space:pre-wrap; line-height:1.5;}

  @media (max-width:820px){
    #app{flex-direction:column;}
    .sidebar{width:100%; border-right:none; border-bottom:1px solid var(--border); flex-direction:row; flex-wrap:wrap; align-items:center;}
    .brand-list{flex-direction:row; flex-wrap:wrap;}
    .sidebar-footer{display:none;}
    .main{padding:18px;}
  }

  @media print{
    html, body, #pdfArea, .event-bar, .pdf-header .bar, .num-badge{
      -webkit-print-color-adjust:exact;
      print-color-adjust:exact;
      color-adjust:exact;
    }
    body{background:#fff;}
    .sidebar, .toolbar, .context-line, .overlay, .feedback-head .btn{display:none !important;}
    .feedback-card{cursor:default; break-inside:avoid;}
    .feedback-text{-webkit-line-clamp:unset; display:block; overflow:visible;}
    .feedback-panel{border:none; padding:18px 0 0; margin-top:16px;}
    .main{padding:0;}
    #pdfArea{
      position:static;
      width:100%;
      border:none;
      border-radius:0;
      padding:0;
      overflow:visible;
    }
    .week-row{break-inside:avoid;}
    .event-bar{
      height:22px;
      font-size:11px;
      box-shadow:inset 0 0 0 1px rgba(0,0,0,.18);
    }
    @page{ size:landscape; margin:12mm; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  const BRANDS = [
    {id:'seat-noblejas', name:'SEAT Noblejas', color:'#3A6EA5'},
    {id:'seat-amarco', name:'SEAT Amarco', color:'#5B8C5A'},
    {id:'cupra-noblejas', name:'CUPRA Noblejas', color:'#B23A48'},
    {id:'cupra-amarco', name:'CUPRA Amarco', color:'#C97C3D'},
    {id:'changan-guadalajara', name:'CHANGAN Guadalajara', color:'#6B5B95'},
    {id:'ebro-guadalajara', name:'EBRO Guadalajara', color:'#4A7C7C'},
    {id:'a-car-for-you', name:'A Car For You', color:'#8C6A4F'},
  ];
  const WEEKDAYS = ['L','M','X','J','V','S','D'];
  const MONTHS = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const STORAGE_KEY = 'media-plan-campaigns-v1';
  const COMMENTS_KEY = 'media-plan-comments-v1';

  const today = new Date();
  const state = {
    selectedBrand: BRANDS[0].id,
    viewYear: today.getFullYear(),
    viewMonth: today.getMonth(),
    campaigns: {},
    comments: {},
    modal: null,
    loaded: false,
  };

  function pad(n){return String(n).padStart(2,'0');}
  function dateToStr(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
  function strToDate(s){
    const [y,m,d] = s.split('-').map(Number);
    return new Date(y, m-1, d);
  }
  function sameDay(a,b){return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();}
  function dayDiff(a,b){return Math.round((b-a)/86400000);}
  function brandOf(id){return BRANDS.find(b=>b.id===id);}
  function uid(prefix){return (prefix||'c')+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
  function fmtLongDate(s){
    const d = strToDate(s);
    return `${d.getDate()} de ${MONTHS[d.getMonth()].toLowerCase()} de ${d.getFullYear()}`;
  }
  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  const hasClaudeStorage = () => (typeof window.storage === 'object' && window.storage && typeof window.storage.get === 'function');

  async function loadStored(key){
    if(hasClaudeStorage()){
      const res = await window.storage.get(key, false);
      return res && res.value ? JSON.parse(res.value) : {};
    }
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : {};
  }

  async function loadCampaigns(){
    try{
      const parsed = await loadStored(STORAGE_KEY);
      BRANDS.forEach(b=>{ state.campaigns[b.id] = (parsed[b.id]||[]).map(c=>({...c})); });
    }catch(e){
      BRANDS.forEach(b=>{ state.campaigns[b.id] = []; });
    }
    try{
      const parsed = await loadStored(COMMENTS_KEY);
      BRANDS.forEach(b=>{ state.comments[b.id] = (parsed[b.id]||[]).map(c=>({...c})); });
    }catch(e){
      BRANDS.forEach(b=>{ state.comments[b.id] = []; });
    }
    state.loaded = true;
    if(ensureCampaignTones()) await persist();
  }

  async function persist(){
    try{
      if(hasClaudeStorage()){
        await window.storage.set(STORAGE_KEY, JSON.stringify(state.campaigns), false);
        await window.storage.set(COMMENTS_KEY, JSON.stringify(state.comments), false);
      } else {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.campaigns));
        localStorage.setItem(COMMENTS_KEY, JSON.stringify(state.comments));
      }
    }catch(e){ /* best effort */ }
  }

  function getMonthWeeks(year, month){
    const firstOfMonth = new Date(year, month, 1);
    const lastOfMonth = new Date(year, month+1, 0);
    const startOffset = (firstOfMonth.getDay() + 6) % 7;
    let cursor = new Date(year, month, 1 - startOffset);
    const weeks = [];
    while(true){
      const week = [];
      for(let i=0;i<7;i++){
        week.push(new Date(cursor));
        cursor.setDate(cursor.getDate()+1);
      }
      weeks.push(week);
      if(week.some(d=>sameDay(d,lastOfMonth))) break;
    }
    return weeks;
  }

  function hexToHsl(hex){
    const n = String(hex).replace('#','');
    const r = parseInt(n.slice(0,2),16)/255;
    const g = parseInt(n.slice(2,4),16)/255;
    const b = parseInt(n.slice(4,6),16)/255;
    const max = Math.max(r,g,b), min = Math.min(r,g,b);
    let h = 0, s = 0, l = (max+min)/2;
    if(max !== min){
      const d = max-min;
      s = l > 0.5 ? d/(2-max-min) : d/(max+min);
      if(max===r) h = (g-b)/d + (g<b?6:0);
      else if(max===g) h = (b-r)/d + 2;
      else h = (r-g)/d + 4;
      h /= 6;
    }
    return [h*360, s*100, l*100];
  }
  function clamp(n, min, max){ return Math.min(max, Math.max(min, n)); }
  const TONE_STEPS = [
    {s:1.00, l:1.00},
    {s:0.86, l:1.24},
    {s:1.10, l:0.80},
    {s:0.72, l:1.40},
    {s:1.08, l:1.12},
    {s:0.90, l:0.70},
    {s:0.68, l:1.55},
    {s:0.98, l:1.30},
  ];
  function campaignShade(hex, tone){
    const [h,s,l] = hexToHsl(hex);
    const step = TONE_STEPS[(Number(tone)||0) % TONE_STEPS.length];
    const sat = clamp(s * step.s, 28, 78);
    const lig = clamp(l * step.l, 28, 66);
    return {
      css: `hsl(${Math.round(h)} ${Math.round(sat)}% ${Math.round(lig)}%)`,
      ink: lig > 54 ? '#1B1C1E' : '#ffffff',
    };
  }
  function nextTone(brandId){
    const used = (state.campaigns[brandId]||[]).map(c=>c.tone);
    const count = TONE_STEPS.length;
    for(let i=0;i<count;i++) if(!used.includes(i)) return i;
    const freq = Array(count).fill(0);
    used.forEach(t=>{ if(Number.isInteger(t)) freq[t%count]++; });
    return freq.indexOf(Math.min(...freq));
  }
  function ensureCampaignTones(){
    let changed = false;
    BRANDS.forEach(b=>{
      const list = state.campaigns[b.id]||[];
      const used = new Set(list.filter(c=>Number.isInteger(c.tone)).map(c=>c.tone));
      list.forEach(c=>{
        if(!Number.isInteger(c.tone)){
          let t = 0;
          while(used.has(t) && t < TONE_STEPS.length) t++;
          c.tone = t % TONE_STEPS.length;
          used.add(c.tone);
          changed = true;
        }
      });
    });
    return changed;
  }
  function visualForCampaign(brandId, campaign){
    const b = brandOf(brandId);
    return campaignShade(b.color, campaign && campaign.tone);
  }
  function withBrandMeta(listByBrand){
    if(state.selectedBrand === 'ALL'){
      let all = [];
      BRANDS.forEach(b=>{
        (listByBrand[b.id]||[]).forEach(c=> all.push({...c, brandId:b.id, color:b.color, brandName:b.name}));
      });
      return all;
    }
    const b = brandOf(state.selectedBrand);
    return (listByBrand[state.selectedBrand]||[]).map(c=>({...c, brandId:b.id, color:b.color, brandName:b.name}));
  }
  function getVisibleCampaigns(){
    return withBrandMeta(state.campaigns).map(c=>{
      const shade = campaignShade(c.color, c.tone);
      return {...c, brandColor:c.color, color:shade.css, ink:shade.ink};
    });
  }
  function getVisibleComments(){
    return withBrandMeta(state.comments).sort((a,b)=> (b.date||'').localeCompare(a.date||'') || (b.id||'').localeCompare(a.id||''));
  }
  function campaignsForBrand(brandId){
    return (state.campaigns[brandId]||[]).slice().sort((a,b)=> (a.start||'').localeCompare(b.start||'') || (a.name||'').localeCompare(b.name||''));
  }
  function campaignById(brandId, campaignId){
    return (state.campaigns[brandId]||[]).find(x=>x.id===campaignId);
  }
  function commentCampaignName(comment){
    if(!comment.campaignId && !comment.campaignName) return 'Sin campaña asociada';
    const live = campaignById(comment.brandId, comment.campaignId);
    if(live) return live.name;
    return comment.campaignName || 'Campaña eliminada';
  }
  function campaignOptionsHtml(brandId, selectedId){
    const list = campaignsForBrand(brandId);
    if(!list.length){
      return `<option value="">No hay campañas en esta marca</option>`;
    }
    return `<option value="">Selecciona una campaña</option>` + list.map(c=>
      `<option value="${c.id}" ${c.id===selectedId?'selected':''}>${escapeHtml(c.name)} · ${fmtLongDate(c.start)} – ${fmtLongDate(c.end)}</option>`
    ).join('');
  }

  function assignLanes(campaigns, gridStart, gridEnd){
    const relevant = campaigns
      .map(c=>({...c, sd:strToDate(c.start), ed:strToDate(c.end)}))
      .filter(c=> c.ed >= gridStart && c.sd <= gridEnd)
      .sort((a,b)=> a.sd - b.sd || (b.ed-b.sd) - (a.ed-a.sd));
    const lanes = [];
    relevant.forEach(c=>{
      let laneIdx = lanes.findIndex(lane => lane.every(other => other.ed < c.sd || other.sd > c.ed));
      if(laneIdx === -1){ laneIdx = lanes.length; lanes.push([]); }
      lanes[laneIdx].push(c);
      c.lane = laneIdx;
    });
    return {campaigns: relevant, maxLanes: lanes.length};
  }

  function render(){
    const app = document.getElementById('app');
    if(!state.loaded){
      app.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;width:100%;height:100vh;color:var(--ink-soft);font-size:13.5px;">Cargando plan de medios…</div>`;
      return;
    }
    app.innerHTML = renderSidebar() + renderMain();
    if(state.modal) app.innerHTML += renderModal();
    bindEvents();
  }

  function renderSidebar(){
    const items = BRANDS.map(b=>{
      const count = (state.campaigns[b.id]||[]).length;
      const active = state.selectedBrand === b.id;
      return `<button class="brand-item ${active?'active':''}" data-select-brand="${b.id}">
        <span class="brand-dot" style="background:${b.color}"></span>
        <span class="brand-name">${escapeHtml(b.name)}</span>
        <span class="brand-count">${count}</span>
      </button>`;
    }).join('');
    const allActive = state.selectedBrand === 'ALL';
    return `<aside class="sidebar">
      <div class="brand-title">Plan de medios<span>Calendario de campañas por marca</span></div>
      <div class="brand-list">${items}</div>
      <button class="all-toggle ${allActive?'active':''}" data-select-brand="ALL">
        <span class="swatches">${BRANDS.map(b=>`<i style="background:${b.color}"></i>`).join('')}</span>
        Ver todas las marcas
      </button>
      <div class="sidebar-footer">Selecciona una marca para ver su calendario, añadir campañas o dejar feedback del supervisor.</div>
    </aside>`;
  }

  function renderMain(){
    const weeks = getMonthWeeks(state.viewYear, state.viewMonth);
    const gridStart = weeks[0][0], gridEnd = weeks[weeks.length-1][6];
    const visible = getVisibleCampaigns();
    const {campaigns: laneCampaigns, maxLanes} = assignLanes(visible, gridStart, gridEnd);

    const isAll = state.selectedBrand === 'ALL';
    const brand = isAll ? null : brandOf(state.selectedBrand);
    const monthCampaignsCount = visible.filter(c=>{
      const sd = strToDate(c.start), ed = strToDate(c.end);
      const monthStart = new Date(state.viewYear, state.viewMonth, 1);
      const monthEnd = new Date(state.viewYear, state.viewMonth+1, 0);
      return ed >= monthStart && sd <= monthEnd;
    }).length;

    const yearOptions = [];
    const curY = today.getFullYear();
    for(let y = curY-3; y <= curY+4; y++){
      yearOptions.push(`<option value="${y}" ${y===state.viewYear?'selected':''}>${y}</option>`);
    }

    const weekdayRow = `<div class="weekday-row">${WEEKDAYS.map(w=>`<div>${w}</div>`).join('')}</div>`;
    const weeksHtml = weeks.map(week=>{
      const bgCells = week.map((d,i)=>`<div class="cell-bg" style="grid-column:${i+1}"></div>`).join('');
      const numCells = week.map((d,i)=>{
        const inMonth = d.getMonth()===state.viewMonth;
        const isToday = sameDay(d, today);
        return `<div class="day-num day-cell-click ${inMonth?'':'dim'} ${isToday?'today':''}" style="grid-column:${i+1}" data-day-click="${dateToStr(d)}">
          ${isToday?`<span class="num-badge">${d.getDate()}</span>`:d.getDate()}
        </div>`;
      }).join('');
      const barsForWeek = laneCampaigns.filter(c => c.ed >= week[0] && c.sd <= week[6]);
      const barsHtml = barsForWeek.map(c=>{
        const clampStart = c.sd < week[0] ? week[0] : c.sd;
        const clampEnd = c.ed > week[6] ? week[6] : c.ed;
        const colStart = dayDiff(week[0], clampStart);
        const colEnd = dayDiff(week[0], clampEnd);
        const roundL = sameDay(clampStart, c.sd) ? 'round-l' : '';
        const roundR = sameDay(clampEnd, c.ed) ? 'round-r' : '';
        const label = isAll ? `${escapeHtml(c.name)} <span class="bname">· ${escapeHtml(brandOf(c.brandId).name)}</span>` : escapeHtml(c.name);
        return `<div class="event-bar ${roundL} ${roundR}" style="grid-column:${colStart+1} / ${colEnd+2}; grid-row:${c.lane+2}; background:${c.color}; color:${c.ink};" data-open-detail="${c.brandId}|${c.id}">${label}</div>`;
      }).join('');
      const rowsTemplate = `minmax(46px,auto) ${maxLanes>0 ? `repeat(${maxLanes},22px)` : ''}`;
      return `<div class="week-row" style="grid-template-rows:${rowsTemplate};">${bgCells}${numCells}${barsHtml}</div>`;
    }).join('');

    const pdfHeader = isAll
      ? `<div class="pdf-header"><h2>Todas las marcas</h2></div>`
      : `<div class="pdf-header"><span class="bar" style="background:${brand.color}"></span><h2>${escapeHtml(brand.name)}</h2><span class="sub">· ${MONTHS[state.viewMonth]} ${state.viewYear}</span></div>`;

    const emptyState = monthCampaignsCount===0 ? `<div class="empty-state">
        <div class="big">Sin campañas programadas</div>
        <div class="small">${isAll ? 'Ninguna marca tiene campañas este mes.' : 'Añade una campaña para verla en el calendario.'}</div>
      </div>` : '';

    return `<main class="main">
      <div class="toolbar">
        <div class="month-nav">
          <button class="nav-btn" data-nav="-1">&#8249;</button>
          <div class="month-label">${MONTHS[state.viewMonth]} <span class="yr">${state.viewYear}</span></div>
          <button class="nav-btn" data-nav="1">&#8250;</button>
          <select class="year-select" id="yearSelect">${yearOptions.join('')}</select>
          <button class="today-btn" data-today="1">Hoy</button>
        </div>
        <div class="toolbar-actions">
          <button class="btn btn-ghost" data-export-pdf="1" ${isAll?'disabled title="Selecciona una marca para descargar su PDF"':'title="Se abrirá el diálogo de impresión: elige \'Guardar como PDF\'"'}>Descargar PDF</button>
          <button class="btn btn-primary" data-open-add="1">+ Añadir campaña</button>
        </div>
      </div>
      <div class="context-line">
        <div class="context-count"><b>${monthCampaignsCount}</b> campaña${monthCampaignsCount===1?'':'s'} en ${MONTHS[state.viewMonth].toLowerCase()}</div>
      </div>
      <div id="pdfArea">
        ${pdfHeader}
        ${weekdayRow}
        ${weeksHtml}
        ${emptyState}
      </div>
      ${renderFeedback()}
    </main>`;
  }

  function renderFeedback(){
    const isAll = state.selectedBrand === 'ALL';
    const comments = getVisibleComments();
    const brand = isAll ? null : brandOf(state.selectedBrand);
    const cards = comments.map(c=>{
      const brandTag = isAll
        ? `<span class="feedback-brand-tag"><span class="brand-dot" style="background:${c.color}"></span>${escapeHtml(c.brandName)}</span>`
        : '';
      const campaignName = commentCampaignName(c);
      const camp = campaignById(c.brandId, c.campaignId);
      const campColor = visualForCampaign(c.brandId, camp).css;
      return `<button class="feedback-card" data-open-comment="${c.brandId}|${c.id}">
        <div class="feedback-card-meta">
          <span class="feedback-author">${escapeHtml(c.author)}</span>
          <span class="feedback-date">${fmtLongDate(c.date)}</span>
          ${brandTag}
        </div>
        <div class="feedback-campaign"><span class="brand-dot" style="background:${campColor}"></span><span>Campaña · </span>${escapeHtml(campaignName)}</div>
        <div class="feedback-text">${escapeHtml(c.text)}</div>
      </button>`;
    }).join('');
    const empty = comments.length===0
      ? `<div class="feedback-empty">${isAll ? 'Ninguna marca tiene comentarios de supervisión todavía.' : 'Aún no hay feedback para esta marca. Añade el primer comentario.'}</div>`
      : `<div class="feedback-list">${cards}</div>`;
    return `<section class="feedback-panel">
      <div class="feedback-head">
        <div>
          <h3>Feedback</h3>
          <div class="sub">${isAll ? 'Comentarios de todas las marcas' : escapeHtml(brand.name)} · ${comments.length} comentario${comments.length===1?'':'s'}</div>
        </div>
        <button class="btn btn-ghost" data-open-add-comment="1">+ Añadir comentario</button>
      </div>
      ${empty}
    </section>`;
  }

  function renderModal(){
    if(!state.modal) return '';
    if(state.modal.type === 'add'){
      const isAll = state.selectedBrand === 'ALL';
      const defaultBrand = state.modal.brandId || (isAll ? BRANDS[0].id : state.selectedBrand);
      const brandField = isAll
        ? `<div class="field"><label>Marca</label>
            <select id="fCampaignBrand">${BRANDS.map(b=>`<option value="${b.id}" ${b.id===defaultBrand?'selected':''}>${escapeHtml(b.name)}</option>`).join('')}</select>
          </div>`
        : `<div class="field"><label>Marca</label>
            <div class="brand-fixed"><span class="brand-dot" style="background:${brandOf(defaultBrand).color}"></span>${escapeHtml(brandOf(defaultBrand).name)}</div>
          </div>`;
      const prefill = state.modal.prefillDate || dateToStr(today);
      return `<div class="overlay open" data-close-overlay="1">
        <div class="modal" onclick="event.stopPropagation()">
          <h3>Añadir campaña</h3>
          <div class="modal-sub">Se mostrará en el calendario de la marca seleccionada.</div>
          ${brandField}
          <div class="field"><label>Nombre de la campaña</label><input type="text" id="fCampaignName" placeholder="Ej. Campaña Black Friday" maxlength="80"></div>
          <div class="field-row">
            <div class="field"><label>Fecha de inicio</label><input type="date" id="fCampaignStart" value="${prefill}"></div>
            <div class="field"><label>Fecha de fin</label><input type="date" id="fCampaignEnd" value="${prefill}"></div>
          </div>
          <div class="field"><label>Descripción breve</label><textarea id="fCampaignDesc" placeholder="Objetivo, canal, presupuesto…" maxlength="240"></textarea></div>
          <div class="field-error" id="fCampaignError"></div>
          <div class="modal-actions">
            <button class="btn btn-ghost" data-close-overlay="1">Cancelar</button>
            <button class="btn btn-primary" data-save-campaign="1">Guardar campaña</button>
          </div>
        </div>
      </div>`;
    }
    if(state.modal.type === 'detail'){
      const c = (state.campaigns[state.modal.brandId]||[]).find(x=>x.id===state.modal.campaignId);
      if(!c) return '';
      const b = brandOf(state.modal.brandId);
      const shade = visualForCampaign(state.modal.brandId, c);
      return `<div class="overlay open" data-close-overlay="1">
        <div class="modal" onclick="event.stopPropagation()">
          <div class="detail-swatch" style="background:${shade.css}"></div>
          <h3>${escapeHtml(c.name)}</h3>
          <div class="modal-sub">${escapeHtml(b.name)}</div>
          <div class="detail-row"><div class="lbl">Fechas</div><div class="val">${fmtLongDate(c.start)} — ${fmtLongDate(c.end)}</div></div>
          ${c.description ? `<div class="detail-row"><div class="lbl">Descripción</div><div class="val desc">${escapeHtml(c.description)}</div></div>` : ''}
          <div class="modal-actions">
            <button class="btn btn-ghost" data-delete-campaign="${state.modal.brandId}|${c.id}">Eliminar</button>
            <button class="btn btn-primary" data-close-overlay="1">Cerrar</button>
          </div>
        </div>
      </div>`;
    }
    if(state.modal.type === 'add-comment'){
      const isAll = state.selectedBrand === 'ALL';
      const defaultBrand = state.modal.brandId || (isAll ? BRANDS[0].id : state.selectedBrand);
      const brandField = isAll
        ? `<div class="field"><label>Marca</label>
            <select id="fCommentBrand">${BRANDS.map(b=>`<option value="${b.id}" ${b.id===defaultBrand?'selected':''}>${escapeHtml(b.name)}</option>`).join('')}</select>
          </div>`
        : `<div class="field"><label>Marca</label>
            <div class="brand-fixed"><span class="brand-dot" style="background:${brandOf(defaultBrand).color}"></span>${escapeHtml(brandOf(defaultBrand).name)}</div>
          </div>`;
      return `<div class="overlay open" data-close-overlay="1">
        <div class="modal" onclick="event.stopPropagation()">
          <h3>Añadir comentario</h3>
          <div class="modal-sub">Indica a qué campaña de la marca se refiere el feedback.</div>
          ${brandField}
          <div class="field"><label>Campaña</label>
            <select id="fCommentCampaign">${campaignOptionsHtml(defaultBrand)}</select>
          </div>
          <div class="field"><label>Supervisor</label><input type="text" id="fCommentAuthor" placeholder="Nombre de quien deja el feedback" maxlength="80"></div>
          <div class="field"><label>Fecha</label><input type="date" id="fCommentDate" value="${dateToStr(today)}"></div>
          <div class="field"><label>Comentario</label><textarea id="fCommentText" placeholder="Ajustes, aprobación, puntos a revisar…" maxlength="800" style="min-height:110px"></textarea></div>
          <div class="field-error" id="fCommentError"></div>
          <div class="modal-actions">
            <button class="btn btn-ghost" data-close-overlay="1">Cancelar</button>
            <button class="btn btn-primary" data-save-comment="1">Guardar comentario</button>
          </div>
        </div>
      </div>`;
    }
    if(state.modal.type === 'comment-detail'){
      const c = (state.comments[state.modal.brandId]||[]).find(x=>x.id===state.modal.commentId);
      if(!c) return '';
      const b = brandOf(state.modal.brandId);
      const camp = campaignById(state.modal.brandId, c.campaignId);
      const shade = visualForCampaign(state.modal.brandId, camp);
      return `<div class="overlay open" data-close-overlay="1">
        <div class="modal" onclick="event.stopPropagation()">
          <div class="detail-swatch" style="background:${shade.css}"></div>
          <h3>${escapeHtml(c.author)}</h3>
          <div class="modal-sub">${escapeHtml(b.name)} · ${fmtLongDate(c.date)}</div>
          <div class="detail-row"><div class="lbl">Campaña</div><div class="val">${escapeHtml(commentCampaignName({...c, brandId:state.modal.brandId}))}</div></div>
          <div class="detail-row"><div class="lbl">Comentario</div><div class="val desc">${escapeHtml(c.text)}</div></div>
          <div class="modal-actions">
            <button class="btn btn-ghost" data-delete-comment="${state.modal.brandId}|${c.id}">Eliminar</button>
            <button class="btn btn-primary" data-close-overlay="1">Cerrar</button>
          </div>
        </div>
      </div>`;
    }
    return '';
  }

  function bindEvents(){
    document.querySelectorAll('[data-select-brand]').forEach(el=>{
      el.addEventListener('click', ()=>{ state.selectedBrand = el.getAttribute('data-select-brand'); render(); });
    });
    document.querySelectorAll('[data-nav]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const delta = parseInt(el.getAttribute('data-nav'),10);
        let m = state.viewMonth + delta, y = state.viewYear;
        if(m<0){m=11;y--;} if(m>11){m=0;y++;}
        state.viewMonth = m; state.viewYear = y; render();
      });
    });
    const yearSelect = document.getElementById('yearSelect');
    if(yearSelect){ yearSelect.addEventListener('change', ()=>{ state.viewYear = parseInt(yearSelect.value,10); render(); }); }
    const todayBtn = document.querySelector('[data-today]');
    if(todayBtn){ todayBtn.addEventListener('click', ()=>{ state.viewMonth = today.getMonth(); state.viewYear = today.getFullYear(); render(); }); }

    const addBtn = document.querySelector('[data-open-add]');
    if(addBtn){ addBtn.addEventListener('click', ()=>{ state.modal = {type:'add'}; render(); }); }

    document.querySelectorAll('[data-day-click]').forEach(el=>{
      el.addEventListener('click', ()=>{ state.modal = {type:'add', prefillDate: el.getAttribute('data-day-click')}; render(); });
    });

    document.querySelectorAll('[data-open-detail]').forEach(el=>{
      el.addEventListener('click', (e)=>{
        e.stopPropagation();
        const [brandId, campaignId] = el.getAttribute('data-open-detail').split('|');
        state.modal = {type:'detail', brandId, campaignId};
        render();
      });
    });

    document.querySelectorAll('[data-close-overlay]').forEach(el=>{
      el.addEventListener('click', ()=>{ state.modal = null; render(); });
    });

    const saveBtn = document.querySelector('[data-save-campaign]');
    if(saveBtn){
      saveBtn.addEventListener('click', async ()=>{
        const isAll = state.selectedBrand === 'ALL';
        const brandSel = document.getElementById('fCampaignBrand');
        const brandId = isAll ? brandSel.value : state.selectedBrand;
        const name = document.getElementById('fCampaignName').value.trim();
        const start = document.getElementById('fCampaignStart').value;
        const end = document.getElementById('fCampaignEnd').value;
        const desc = document.getElementById('fCampaignDesc').value.trim();
        const errEl = document.getElementById('fCampaignError');
        if(!name || !start || !end){ errEl.textContent = 'Completa el nombre y las fechas de la campaña.'; errEl.classList.add('show'); return; }
        if(strToDate(end) < strToDate(start)){ errEl.textContent = 'La fecha de fin no puede ser anterior a la de inicio.'; errEl.classList.add('show'); return; }
        state.campaigns[brandId] = state.campaigns[brandId] || [];
        state.campaigns[brandId].push({id:uid('c'), name, start, end, description:desc, tone: nextTone(brandId)});
        await persist();
        state.modal = null;
        render();
      });
    }

    const delBtn = document.querySelector('[data-delete-campaign]');
    if(delBtn){
      delBtn.addEventListener('click', async ()=>{
        const [brandId, campaignId] = delBtn.getAttribute('data-delete-campaign').split('|');
        state.campaigns[brandId] = (state.campaigns[brandId]||[]).filter(c=>c.id!==campaignId);
        await persist();
        state.modal = null;
        render();
      });
    }

    const addCommentBtn = document.querySelector('[data-open-add-comment]');
    if(addCommentBtn){ addCommentBtn.addEventListener('click', ()=>{ state.modal = {type:'add-comment'}; render(); }); }

    document.querySelectorAll('[data-open-comment]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const [brandId, commentId] = el.getAttribute('data-open-comment').split('|');
        state.modal = {type:'comment-detail', brandId, commentId};
        render();
      });
    });

    const commentBrandSel = document.getElementById('fCommentBrand');
    const commentCampaignSel = document.getElementById('fCommentCampaign');
    if(commentBrandSel && commentCampaignSel){
      commentBrandSel.addEventListener('change', ()=>{
        commentCampaignSel.innerHTML = campaignOptionsHtml(commentBrandSel.value);
      });
    }

    const saveCommentBtn = document.querySelector('[data-save-comment]');
    if(saveCommentBtn){
      saveCommentBtn.addEventListener('click', async ()=>{
        const isAll = state.selectedBrand === 'ALL';
        const brandSel = document.getElementById('fCommentBrand');
        const brandId = isAll ? brandSel.value : state.selectedBrand;
        const campaignId = document.getElementById('fCommentCampaign').value;
        const author = document.getElementById('fCommentAuthor').value.trim();
        const date = document.getElementById('fCommentDate').value;
        const text = document.getElementById('fCommentText').value.trim();
        const errEl = document.getElementById('fCommentError');
        const campaign = campaignById(brandId, campaignId);
        if(!campaignId || !campaign){ errEl.textContent = 'Selecciona la campaña a la que se refiere el comentario.'; errEl.classList.add('show'); return; }
        if(!author || !date || !text){ errEl.textContent = 'Completa el nombre del supervisor, la fecha y el comentario.'; errEl.classList.add('show'); return; }
        state.comments[brandId] = state.comments[brandId] || [];
        state.comments[brandId].push({id:uid('f'), author, date, text, campaignId, campaignName: campaign.name});
        await persist();
        state.modal = null;
        render();
      });
    }

    const delCommentBtn = document.querySelector('[data-delete-comment]');
    if(delCommentBtn){
      delCommentBtn.addEventListener('click', async ()=>{
        const [brandId, commentId] = delCommentBtn.getAttribute('data-delete-comment').split('|');
        state.comments[brandId] = (state.comments[brandId]||[]).filter(c=>c.id!==commentId);
        await persist();
        state.modal = null;
        render();
      });
    }

    const pdfBtn = document.querySelector('[data-export-pdf]');
    if(pdfBtn && !pdfBtn.disabled){
      pdfBtn.addEventListener('click', exportPdf);
    }
  }

  function exportPdf(){
    const brand = brandOf(state.selectedBrand);
    const fileSlug = brand.name.toLowerCase().replace(/[^a-z0-9]+/g,'-');
    const originalTitle = document.title;
    document.title = `plan-medios-${fileSlug}-${state.viewYear}-${pad(state.viewMonth+1)}`;
    window.print();
    setTimeout(()=>{ document.title = originalTitle; }, 500);
  }

  (async function init(){
    render();
    await loadCampaigns();
    render();
  })();
})();
</script>
</body>
</html>
